<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="300" height="300" fill="white"/>
  
  <!-- Vector u (diagonal upward) -->
  <defs>
    <marker id="arrowhead-u" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black"/>
    </marker>
  </defs>
  
  <line x1="50" y1="250" x2="250" y2="50" stroke="black" stroke-width="2" marker-end="url(#arrowhead-u)"/>
  
  <!-- Vector v (horizontal right) -->
  <defs>
    <marker id="arrowhead-v" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black"/>
    </marker>
  </defs>
  
  <line x1="50" y1="250" x2="200" y2="212.5" stroke="black" stroke-width="2" marker-end="url(#arrowhead-v)"/>
  
  <!-- Labels -->
  <text x="130" y="135" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="black">u</text>
  <text x="135" y="245" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="black">v</text>
</svg>